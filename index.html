<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institutional Alpha — US Equity Returns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  :root {
    --bg:        #0a0c0f;
    --bg2:       #0f1318;
    --bg3:       #141920;
    --border:    #1e2730;
    --border2:   #2a3540;
    --text:      #c8d4de;
    --text2:     #7a8fa0;
    --text3:     #4a5f70;
    --accent:    #f0a500;
    --accent2:   #e06020;
    --green:     #00d084;
    --green2:    #00a86b;
    --red:       #ff4d6a;
    --red2:      #cc2244;
    --blue:      #4db8ff;
    --blue2:     #2090dd;
    --purple:    #a080ff;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 13px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* ── Top bar ── */
  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo span { color: var(--text2); }
  .topbar-meta {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.06em;
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .updated-time {
    font-size: 11px;
    color: var(--text3);
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }

  /* ── Benchmark bar ── */
  .benchmark-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 32px;
    height: 40px;
    overflow-x: auto;
  }
  .benchmark-item {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .bm-name { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }
  .bm-price { font-size: 12px; color: var(--text); font-weight: 500; }
  .bm-return { font-size: 11px; font-weight: 600; }
  .bm-return.pos { color: var(--green); }
  .bm-return.neg { color: var(--red); }
  .bm-sep { width: 1px; height: 20px; background: var(--border); }

  /* ── Main layout ── */
  .layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    grid-template-rows: 1fr;
    height: calc(100vh - 88px);
  }

  /* ── Left panel — rankings ── */
  .panel-left {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg);
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    position: sticky; top: 0; z-index: 10;
  }
  .panel-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text2);
  }
  .period-tabs {
    display: flex;
    gap: 2px;
  }
  .period-tab {
    padding: 3px 8px;
    font-size: 10px;
    font-family: var(--font-mono);
    letter-spacing: 0.06em;
    color: var(--text3);
    background: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .period-tab.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(240,165,0,0.06);
  }
  .period-tab:hover:not(.active) { color: var(--text); }

  /* Institution row */
  .inst-row {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 8px;
    align-items: center;
  }
  .inst-row:hover { background: rgba(255,255,255,0.02); }
  .inst-row.selected { background: rgba(240,165,0,0.06); border-left: 2px solid var(--accent); }

  .rank-num {
    font-size: 12px;
    color: var(--text3);
    text-align: right;
    font-weight: 600;
  }
  .rank-num.top3 { color: var(--accent); }

  .inst-info { min-width: 0; }
  .inst-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.02em;
  }
  .inst-type {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .inst-return-block { text-align: right; flex-shrink: 0; }
  .inst-return-main {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .inst-return-main.pos { color: var(--green); }
  .inst-return-main.neg { color: var(--red); }
  .inst-return-sub {
    font-size: 10px;
    color: var(--text3);
    margin-top: 1px;
  }

  /* Return bar */
  .return-bar-container {
    height: 2px;
    background: var(--border);
    margin-top: 6px;
    border-radius: 1px;
    overflow: hidden;
    grid-column: 2 / 4;
  }
  .return-bar {
    height: 100%;
    border-radius: 1px;
    transition: width 0.6s ease;
  }
  .return-bar.pos { background: var(--green); }
  .return-bar.neg { background: var(--red); }

  /* ── Right panel — detail ── */
  .panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .detail-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    font-family: var(--font-sans);
  }
  .detail-type-badge {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--border2);
    border-radius: 2px;
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
    font-family: var(--font-mono);
  }
  .detail-returns {
    display: flex;
    gap: 32px;
  }
  .detail-return-item { text-align: right; }
  .dri-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }
  .dri-value {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-top: 2px;
  }
  .dri-value.pos { color: var(--green); }
  .dri-value.neg { color: var(--red); }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    align-content: start;
  }

  /* Chart section */
  .chart-section { }
  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .chart-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 16px;
    height: 220px;
  }

  /* Holdings table */
  .holdings-section { }
  .holdings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .holdings-table th {
    text-align: right;
    color: var(--text3);
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  .holdings-table th:first-child { text-align: left; }
  .holdings-table td {
    padding: 7px 8px;
    text-align: right;
    border-bottom: 1px solid rgba(30,39,48,0.6);
  }
  .holdings-table td:first-child { text-align: left; }
  .holdings-table tr:hover td { background: rgba(255,255,255,0.015); }
  .ticker-cell {
    font-weight: 600;
    color: var(--blue);
    letter-spacing: 0.04em;
    font-size: 12px;
  }
  .weight-cell { color: var(--text2); }
  .td-pos { color: var(--green); font-weight: 500; }
  .td-neg { color: var(--red); font-weight: 500; }
  .td-neutral { color: var(--text2); }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
    grid-column: 1 / -1;
  }
  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 14px 16px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }
  .stat-value.neutral { color: var(--text); }

  /* vs Benchmark row */
  .vs-bench {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin-top: 4px;
    grid-column: 1 / -1;
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .vs-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; white-space: nowrap; }
  .vs-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .vs-name { font-size: 10px; color: var(--text3); }
  .vs-diff {
    font-size: 13px;
    font-weight: 600;
  }
  .vs-diff.pos { color: var(--green); }
  .vs-diff.neg { color: var(--red); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text3);
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  /* Animations */
  .inst-row { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Institutional<span>Alpha</span></div>
    <div class="topbar-meta"><span class="live-dot"></span>LIVE · US EQUITY · 13F DERIVED</div>
  </div>
  <div class="updated-time" id="updated-time">Loading...</div>
</div>

<!-- Benchmark ticker bar -->
<div class="benchmark-bar" id="benchmark-bar">
  <span class="topbar-meta" style="color:var(--text3)">Loading benchmarks...</span>
</div>

<!-- Main layout -->
<div class="layout">

  <!-- Left: Rankings -->
  <div class="panel-left">
    <div class="panel-header">
      <span class="panel-title">Rankings · Portfolio Return</span>
      <div class="period-tabs">
        <button class="period-tab active" data-period="ytd">YTD</button>
        <button class="period-tab" data-period="ret_1m">1M</button>
        <button class="period-tab" data-period="ret_6m">6M</button>
        <button class="period-tab" data-period="ret_1y">1Y</button>
      </div>
    </div>
    <div id="inst-list"></div>
  </div>

  <!-- Right: Detail -->
  <div class="panel-right">
    <div id="detail-panel" class="loading">← Select an institution</div>
  </div>

</div>

<script>
let DATA = null;
let selectedInst = null;
let currentPeriod = 'ytd';
let chart = null;

const PERIOD_LABELS = { ytd: 'YTD', ret_1m: '1 Month', ret_6m: '6 Month', ret_1y: '1 Year' };

// ── Fetch data ────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('data/institutions.json?t=' + Date.now());
    DATA = await r.json();
    renderAll();
  } catch(e) {
    document.getElementById('inst-list').innerHTML = `<div class="loading" style="padding:40px;text-align:center;color:var(--red)">Failed to load data<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  document.getElementById('updated-time').textContent = '↻ ' + DATA.last_updated;
  renderBenchmarks();
  renderList();
  // Auto-select #1
  if (DATA.institutions.length > 0) selectInstitution(DATA.institutions[0]);
}

function renderBenchmarks() {
  const bar = document.getElementById('benchmark-bar');
  const items = Object.entries(DATA.benchmarks).map(([name, d]) => {
    const ytd = d.ytd;
    const cls = ytd >= 0 ? 'pos' : 'neg';
    const sign = ytd >= 0 ? '+' : '';
    return `
      <div class="benchmark-item">
        <span class="bm-name">${name}</span>
        <span class="bm-price">${d.price.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}</span>
        <span class="bm-return ${cls}">${sign}${ytd.toFixed(2)}%</span>
      </div>
      <div class="bm-sep"></div>
    `;
  }).join('');
  bar.innerHTML = items || '<span class="bm-name">No benchmark data</span>';
}

function renderList() {
  const list = document.getElementById('inst-list');
  // Sort by current period
  const sorted = [...DATA.institutions].sort((a,b) =>
    (b.portfolio_return[currentPeriod] || 0) - (a.portfolio_return[currentPeriod] || 0)
  );

  const maxRet = Math.max(...sorted.map(i => Math.abs(i.portfolio_return[currentPeriod] || 0)));

  list.innerHTML = sorted.map((inst, idx) => {
    const ret = inst.portfolio_return[currentPeriod] || 0;
    const isPos = ret >= 0;
    const sign = isPos ? '+' : '';
    const cls = isPos ? 'pos' : 'neg';
    const isTop3 = idx < 3;
    const barW = maxRet > 0 ? Math.abs(ret) / maxRet * 100 : 0;
    const isSelected = selectedInst && selectedInst.name === inst.name;

    return `
      <div class="inst-row ${isSelected ? 'selected' : ''}" data-name="${inst.name}" onclick="selectByName('${inst.name}')">
        <div class="rank-num ${isTop3 ? 'top3' : ''}">${idx+1}</div>
        <div class="inst-info">
          <div class="inst-name">${inst.name}</div>
          <div class="inst-type">${inst.type}</div>
        </div>
        <div class="inst-return-block">
          <div class="inst-return-main ${cls}">${sign}${ret.toFixed(2)}%</div>
          <div class="inst-return-sub">${PERIOD_LABELS[currentPeriod]}</div>
        </div>
        <div class="return-bar-container">
          <div class="return-bar ${cls}" style="width:${barW}%"></div>
        </div>
      </div>
    `;
  }).join('');
}

function selectByName(name) {
  const inst = DATA.institutions.find(i => i.name === name);
  if (inst) selectInstitution(inst);
}

function selectInstitution(inst) {
  selectedInst = inst;
  renderList();
  renderDetail(inst);
}

function renderDetail(inst) {
  const panel = document.getElementById('detail-panel');
  const pr = inst.portfolio_return;

  const retSign = (v) => v >= 0 ? '+' : '';
  const retCls = (v) => v >= 0 ? 'pos' : 'neg';

  // vs benchmark comparison
  const spYtd = DATA.benchmarks['S&P 500']?.ytd ?? 0;
  const spAlpha = pr.ytd - spYtd;
  const nqYtd = DATA.benchmarks['NASDAQ']?.ytd ?? 0;
  const nqAlpha = pr.ytd - nqYtd;

  const holdingRows = inst.top_holdings.map(h => {
    const ytdCls = retCls(h.ytd);
    const yyCls = retCls(h.ret_1y);
    return `
      <tr>
        <td class="ticker-cell">${h.ticker}</td>
        <td class="weight-cell">${h.weight_pct.toFixed(1)}%</td>
        <td class="${ytdCls === 'pos' ? 'td-pos' : 'td-neg'}">${retSign(h.ytd)}${h.ytd.toFixed(1)}%</td>
        <td class="${yyCls === 'pos' ? 'td-pos' : 'td-neg'}">${retSign(h.ret_1y)}${h.ret_1y.toFixed(1)}%</td>
        <td class="td-neutral">$${h.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      </tr>
    `;
  }).join('');

  panel.classList.remove('loading');
  panel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${inst.name}</div>
        <div class="detail-type-badge">${inst.type}</div>
      </div>
      <div class="detail-returns">
        <div class="detail-return-item">
          <div class="dri-label">YTD</div>
          <div class="dri-value ${retCls(pr.ytd)}">${retSign(pr.ytd)}${pr.ytd.toFixed(2)}%</div>
        </div>
        <div class="detail-return-item">
          <div class="dri-label">1 Month</div>
          <div class="dri-value ${retCls(pr.ret_1m)}">${retSign(pr.ret_1m)}${pr.ret_1m.toFixed(2)}%</div>
        </div>
        <div class="detail-return-item">
          <div class="dri-label">6 Month</div>
          <div class="dri-value ${retCls(pr.ret_6m)}">${retSign(pr.ret_6m)}${pr.ret_6m.toFixed(2)}%</div>
        </div>
        <div class="detail-return-item">
          <div class="dri-label">1 Year</div>
          <div class="dri-value ${retCls(pr.ret_1y)}">${retSign(pr.ret_1y)}${pr.ret_1y.toFixed(2)}%</div>
        </div>
      </div>
    </div>

    <div class="detail-body">
      <!-- Chart -->
      <div class="chart-section">
        <div class="section-label">Portfolio Returns vs Benchmark</div>
        <div class="chart-wrap">
          <canvas id="returns-chart"></canvas>
        </div>
      </div>

      <!-- Holdings table -->
      <div class="holdings-section">
        <div class="section-label">Top Holdings (${inst.holding_count} total)</div>
        <table class="holdings-table">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Weight</th>
              <th>YTD</th>
              <th>1Y</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody>${holdingRows}</tbody>
        </table>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Holdings Count</div>
          <div class="stat-value neutral">${inst.holding_count}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Data Coverage</div>
          <div class="stat-value neutral">${pr.coverage ?? '—'}%</div>
        </div>
        <div class="vs-bench">
          <div class="vs-label">Alpha vs</div>
          <div class="vs-item">
            <div class="vs-name">S&P 500</div>
            <div class="vs-diff ${retCls(spAlpha)}">${retSign(spAlpha)}${spAlpha.toFixed(2)}%</div>
          </div>
          <div class="vs-item">
            <div class="vs-name">NASDAQ</div>
            <div class="vs-diff ${retCls(nqAlpha)}">${retSign(nqAlpha)}${nqAlpha.toFixed(2)}%</div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Render chart after DOM update
  setTimeout(() => renderChart(inst), 50);
}

function renderChart(inst) {
  const ctx = document.getElementById('returns-chart');
  if (!ctx) return;
  if (chart) { chart.destroy(); chart = null; }

  const periods = ['1M', '6M', '1Y', 'YTD'];
  const keys = ['ret_1m', 'ret_6m', 'ret_1y', 'ytd'];

  const instData = keys.map(k => inst.portfolio_return[k] ?? 0);
  const sp500Data = keys.map((k, i) => {
    const m = { ret_1m: 'ret_1m', ret_6m: 'ret_1y', ret_1y: 'ret_1y', ytd: 'ytd' };
    return DATA.benchmarks['S&P 500']?.[k === 'ret_6m' ? 'ytd' : k] ?? 0;
  });
  const nasdaqData = keys.map(k => DATA.benchmarks['NASDAQ']?.[k === 'ret_6m' ? 'ytd' : k] ?? 0);

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: periods,
      datasets: [
        {
          label: inst.name,
          data: instData,
          backgroundColor: instData.map(v => v >= 0 ? 'rgba(0,208,132,0.75)' : 'rgba(255,77,106,0.75)'),
          borderColor: instData.map(v => v >= 0 ? '#00d084' : '#ff4d6a'),
          borderWidth: 1,
          borderRadius: 1,
        },
        {
          label: 'S&P 500',
          data: sp500Data,
          backgroundColor: 'rgba(77,184,255,0.3)',
          borderColor: '#4db8ff',
          borderWidth: 1,
          borderRadius: 1,
          type: 'bar',
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: '#7a8fa0',
            font: { family: 'IBM Plex Mono', size: 10 },
            boxWidth: 10, padding: 14,
          }
        },
        tooltip: {
          backgroundColor: '#0f1318',
          borderColor: '#1e2730',
          borderWidth: 1,
          titleColor: '#c8d4de',
          bodyColor: '#7a8fa0',
          titleFont: { family: 'IBM Plex Mono', size: 11 },
          bodyFont: { family: 'IBM Plex Mono', size: 10 },
          callbacks: {
            label: (ctx) => ` ${ctx.dataset.label}: ${ctx.raw >= 0 ? '+' : ''}${ctx.raw.toFixed(2)}%`
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#1e2730' },
          ticks: { color: '#4a5f70', font: { family: 'IBM Plex Mono', size: 10 } },
          border: { color: '#1e2730' }
        },
        y: {
          grid: { color: '#1e2730' },
          ticks: {
            color: '#4a5f70',
            font: { family: 'IBM Plex Mono', size: 10 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
          },
          border: { color: '#1e2730' }
        }
      }
    }
  });
}

// ── Period tab switching ───────────────────────────────────────────────────────
document.querySelectorAll('.period-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    renderList();
    if (selectedInst) renderDetail(selectedInst);
  });
});

// ── Auto-refresh every 5 minutes ──────────────────────────────────────────────
setInterval(loadData, 5 * 60 * 1000);

// ── Init ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
